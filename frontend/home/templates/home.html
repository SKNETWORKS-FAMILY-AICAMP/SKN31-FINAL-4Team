<!--
  참고용 사본 — 실제로 렌더링되는 파일이 아닙니다.
  이 프로젝트는 Vite 기반 SPA라 화면은 root의 index.html 하나로 동작하고,
  브라우저 JS 라우터(app-shell/static/js/router.js)가 화면 전환을 담당합니다.
  아래 마크업은 home 앱(홈 화면, 챗봇 팝업 — index.html 185-236, 586-618행)이 사용하는 부분을 index.html에서 그대로 옮겨 온 것으로,
  Django 스타일 폴더 구성에 맞춰 정리해 둔 참고 사본입니다.
  실제로 수정하려면 반드시 root의 index.html을 고쳐야 합니다.
-->

<!-- 185-236행: v-home -->
  <section class="view on" id="v-home">
    <div class="chatStage">
      <div class="mwrap heroGrid">
        <div class="heroL">
          <div class="mKicker"><b>BETA</b> 패션 트렌드 AI 에이전트</div>
          <h1 class="mStatement" id="mState">
            <span class="ln">스크롤 속 패션을,</span>
            <span class="ln">하나의 <em class="ul">트렌드</em>로.</span>
          </h1>
          <p>매거진보다 빠르고, 피드보다 선명하게.</p>
        </div>

        <div class="heroR">
          <div class="hot" id="hot">
            <!-- 라벨과 목록을 한 덩어리로 묶어 바 위에 올려 둔다.
                 아래가 고정이라 목록이 자라면 라벨이 같이 밀려 올라간다. -->
            <div class="hotTop">
              <span class="lbl"><u>HOT</u> TREND TOP 10</span>
              <div class="hotList" id="hotList"></div>
            </div>
            <button class="hotBar" id="hotBar">
              <span class="hotRoll" id="hotRoll"></span>
              <span class="cv">▾</span>
            </button>
          </div>

          <div class="chatWrap">
            <div class="imgAttach" id="mImgAttach" hidden></div>
            <div class="chatbar">
              <button class="salmalBtn" id="smToggle" type="button" aria-pressed="false">
                <i class="thumb"></i><span class="tx">일반</span>
              </button>
              <i class="barSep"></i>
              <button class="imgAddBtn" id="mImgAdd" type="button" aria-label="이미지 첨부"><i>+</i></button>
              <input type="file" id="mImgFile" accept="image/*" multiple hidden>
              <div class="cfield">
                <div class="ghostQ" id="ghostQ">
                  <span class="spark">✧</span>
                  <span class="qline" id="qline"></span>
                </div>
                <input type="text" id="mInput" autocomplete="off">
              </div>
              <button class="sendBtn" id="mSend" aria-label="보내기">→</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 대화 스레드 : 질문을 던지면 여기에 쌓인다 -->
    <div class="threadWrap" id="threadWrap">
      <div class="mwrap">
        <div class="thread" id="thread"></div>
        <button class="pill ghost" id="newChat" style="margin:26px auto 0;display:flex">↺ 새 대화</button>
      </div>
    </div>

    <!-- 화면 오른쪽 하단 — 챗봇 팝업을 곧장 띄우는 진입점 -->
    <button class="chatFab" id="chatFab" type="button" aria-label="챗봇 열기">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5.5C4 4.67157 4.67157 4 5.5 4H18.5C19.3284 4 20 4.67157 20 5.5V15.5C20 16.3284 19.3284 17 18.5 17H9L5 20.5V17H5.5C4.67157 17 4 16.3284 4 15.5V5.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
      </svg>
    </button>
  </section>

<!-- 586-618행: 챗봇 팝업(cpOverlay) -->
<!-- ===== 챗봇 팝업 (일반 모드 / 살말 모드 공용 — 프로필·대화 목록만 갈아입는다) ===== -->
<div class="modalOverlay cpOverlay" id="cpOverlay">
  <div class="modalShell cpShell">
    <div class="cpBox" id="cpBox">
      <aside class="cpSide">
        <div class="cpProfile">
          <div class="cpAv" id="cpAv" role="button" tabindex="0" title="일반 / 살말 모드 전환 (Tab)" aria-label="일반 / 살말 모드 전환" aria-keyshortcuts="Tab"></div>
          <div class="cpProfileText">
            <b id="cpName">일반 모드</b>
            <p id="cpDesc"></p>
          </div>
        </div>
        <button type="button" class="cpNewBtn" id="cpNewBtn"><i>＋</i>새로운 대화</button>
        <div class="cpListLabel">대화 목록</div>
        <div class="cpList" id="cpList"></div>
      </aside>
      <div class="cpMain">
        <div class="cpThreadWrap" id="cpThreadWrap">
          <div class="cpEmpty" id="cpEmpty"><p id="cpEmptyText">궁금한 걸 물어보세요.</p></div>
          <div class="thread cpThread" id="cpThread"></div>
        </div>
        <!-- 살말 모드에서 즐겨입는 스타일이 비어 있을 때만 뜬다(취향 = 판단의 35%) -->
        <div class="cpTaste" id="cpTaste" hidden></div>
        <div class="cpInputWrap">
          <div class="imgAttach cpImgAttach" id="cpImgAttach" hidden></div>
          <div class="cpInputRow">
            <button type="button" class="imgAddBtn cpImgAddBtn" id="cpImgAdd" aria-label="이미지 첨부"><i>+</i></button>
            <input type="file" id="cpImgFile" accept="image/*" multiple hidden>
            <textarea id="cpInput" rows="1" placeholder="궁금한 점을 질문해 주세요." autocomplete="off"></textarea>
            <button class="cpSend" id="cpSend" aria-label="보내기">→</button>
          </div>
        </div>
      </div>
    </div>
    <button class="modalClose" id="cpClose" aria-label="닫기">×</button>
  </div>
</div>
