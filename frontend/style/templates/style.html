<!--
  참고용 사본 — 실제로 렌더링되는 파일이 아닙니다.
  이 프로젝트는 Vite 기반 SPA라 화면은 root의 index.html 하나로 동작하고,
  브라우저 JS 라우터(app-shell/static/js/router.js)가 화면 전환을 담당합니다.
  아래 마크업은 style 앱(스타일 화면, 세부 검색 팝업 — index.html 356-391, 433-482행)이 사용하는 부분을 index.html에서 그대로 옮겨 온 것으로,
  Django 스타일 폴더 구성에 맞춰 정리해 둔 참고 사본입니다.
  실제로 수정하려면 반드시 root의 index.html을 고쳐야 합니다.
-->

<!-- 356-391행: v-style -->
  <section class="view" id="v-style">
    <!-- 카테고리 + 자동 순환 쇼케이스 -->
    <div id="styleHome">
      <section class="mSec" style="padding-top:clamp(26px,3.4vw,44px);padding-bottom:0"><div class="mwrap">
        <div class="mSecHead">
          <div><h2 class="styleTitle">코어로 고르는 옷.</h2>
            <p>하나를 고르면 그 코어의 시작과 지금, 그리고 아이템까지 이어집니다.</p></div>
          <span>Style</span>
        </div>
        <div class="stCats" id="stCats"></div>
      </div></section>
      <div style="height:clamp(60px,9vh,110px)"></div>
    </div>

    <!-- 스타일 상세 -->
    <div id="styleDetail" style="display:none">
      <section style="padding:clamp(20px,3vh,34px) 0 0"><div class="mwrap">
        <button class="pill ghost" id="stBack" style="margin-bottom:18px">← 스타일 전체</button>
        <div class="stHero" id="stHero"></div>
      </div></section>
      <section><div class="mwrap"><div class="stAbout" id="stAbout"></div></div></section>
      <section class="mSec" style="padding-bottom:clamp(40px,6vh,70px)"><div class="mwrap">
        <div class="mSecHead"><div><h2 style="font-size:clamp(20px,2.2vw,30px)">인플루언서 피드</h2></div></div>
        <div class="infFeed" id="stInf"></div>
      </div></section>
      <section style="padding-bottom:clamp(60px,9vh,110px)"><div class="mwrap">
        <div class="mSecHead"><div><h2 style="font-size:clamp(20px,2.2vw,30px)">이 스타일의 아이템 <span class="stItemCount" id="stItemCount">Items</span></h2></div>
          <div class="stSortWrap" id="stSort" data-sort="recommend">
            <button type="button" class="stSortBtn" id="stSortBtn" aria-haspopup="listbox" aria-expanded="false">
              <span id="stSortLabel">FEEDiT 추천순</span><i class="stSortCaret" aria-hidden="true"></i></button>
            <div class="stSortMenu" id="stSortMenu" role="listbox" aria-label="아이템 정렬"></div>
          </div></div>
        <!-- 아이템 카테고리 (2026-09-23) — 전체/아우터/상의/하의/원피스/신발 -->
        <div class="itCats" id="stItemCats"></div>
        <div class="itGrid" id="stItems"></div>
        <div class="itMoreWrap"><button type="button" class="itMore" id="stMore">더 보기</button></div>
      </div></section>
    </div>
  </section>

<!-- 433-482행: 세부 검색 팝업(fsPopBg) -->
<!-- ===== 세부 검색 — STYLE · 종류 · 브랜드 · 아이템명 (서로 독립된 필터) =====
     네 칸은 단계가 아니다. 아무 칸이나 골라도 되고, 겹쳐 고르면 교집합이다.
     고른 것은 아래 칩으로 쌓이고, 칩의 ×를 누르면 **그 조건만** 빠진다.
     후보와 개수는 /api/facets 가 준다 (commerce.product · product_term 기준).

     ★ 칸 안의 버튼은 data-fv 다. data-v 를 쓰면 안 된다 —
       app_shell/static/js/router.js 의 전역 클릭 위임이 [data-v] 를
       화면 전환으로 읽어, 필터를 누르는 순간 화면이 통째로 비어 버린다. -->
<div class="fsPopBg" id="fsPopBg">
  <div class="fsPop" role="dialog" aria-label="세부 검색">
    <div class="fsPopHead">
      <div>
        <h3>세부 검색</h3>
      </div>
      <button class="fsX" id="fsPopX" type="button">×</button>
    </div>
    <div class="fsState" id="fsState"></div>
    <div class="fsCols">
      <div class="fsCol" data-lv="0">
        <div class="fsColH">STYLE</div>
        <div class="fsColFind"><input type="text" data-ax="스타일" autocomplete="off" spellcheck="false" placeholder="스타일 찾기" aria-label="스타일 찾기"></div>
        <div class="fsList" id="fsC0"></div>
      </div>
      <div class="fsCol" data-lv="1">
        <div class="fsColH">종류</div>
        <div class="fsColFind"><input type="text" data-ax="종류" autocomplete="off" spellcheck="false" placeholder="종류 찾기" aria-label="종류 찾기"></div>
        <div class="fsList" id="fsC1"></div>
      </div>
      <div class="fsCol" data-lv="2">
        <div class="fsColH">브랜드</div>
        <div class="fsColFind"><input type="text" data-ax="브랜드" autocomplete="off" spellcheck="false" placeholder="브랜드 찾기" aria-label="브랜드 찾기"></div>
        <div class="fsList" id="fsC2"></div>
      </div>
      <div class="fsCol" data-lv="3">
        <div class="fsColH">상품명</div>
        <div class="fsColFind"><input type="text" data-ax="아이템명" autocomplete="off" spellcheck="false" placeholder="상품명 찾기" aria-label="상품명 찾기"></div>
        <div class="fsList" id="fsC3"></div>
      </div>
    </div>
    <div class="fsPopFoot">
      <div class="fsPicked" id="fsPicked"><span class="ph2">아직 고른 조건이 없습니다. 아무 칸이나 눌러 보세요.</span></div>
      <div class="fsActs">
        <button class="fsReset" id="fsReset" type="button">초기화</button>
        <button class="fsApply" id="fsApply" type="button">이 조건으로 분석 <u>→</u></button>
      </div>
    </div>
  </div>
</div>
