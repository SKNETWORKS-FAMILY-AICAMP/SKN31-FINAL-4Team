{% with u=request.resolver_match.url_name %}
<aside class="sub-sidebar">
    <p>DICTIONARY</p>
    <a href="{% url 'dashboard:dictionary_overview' %}" {% if u == 'dictionary_overview' %}class="active"{% endif %}>사전 홈</a>
    <a href="{% url 'dashboard:dictionary_terms' %}"      {% if u == 'dictionary_terms' or u == 'dictionary_term_detail' %}class="active"{% endif %}>표준 용어</a>
    <a href="{% url 'dashboard:dictionary_candidates' %}" {% if u == 'dictionary_candidates' or u == 'dictionary_candidate_detail' %}class="active"{% endif %}>후보 검수</a>
    <a href="{% url 'dashboard:brand_sources' %}"         {% if u == 'brand_sources' %}class="active"{% endif %}>브랜드 매핑</a>
    <a href="{% url 'dashboard:dictionary_quality' %}"     {% if u == 'dictionary_quality' %}class="active"{% endif %}>사전 품질</a>
    <p class="dict-side-group">REFERENCE</p>
    <a href="{% url 'dashboard:brands' %}"                {% if u == 'brands' %}class="active"{% endif %}>브랜드</a>
    <a href="{% url 'dashboard:categories' %}"            {% if u == 'categories' %}class="active"{% endif %}>카테고리</a>
    <a href="{% url 'dashboard:products' %}"              {% if u == 'products' %}class="active"{% endif %}>상품</a>
</aside>
{% endwith %}
