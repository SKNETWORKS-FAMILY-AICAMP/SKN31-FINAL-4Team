{% load dashboard_extras %}
<td class="thumb-cell" style="padding:6px 8px;vertical-align:middle;">
    {% if url %}
    <a href="{{ url }}" target="_blank" rel="noopener" title="{{ url }}"
       style="display:block;width:{{ w }}px;height:{{ h }}px;border-radius:5px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.08);">
        <img src="{{ url|small_thumb }}" alt="" loading="lazy" decoding="async"
             width="{{ w }}" height="{{ h }}"
             style="width:{{ w }}px;height:{{ h }}px;object-fit:contain;display:block;"
             onerror="this.style.visibility='hidden';">
    </a>
    {% else %}
    <span style="display:flex;align-items:center;justify-content:center;width:{{ w }}px;height:{{ h }}px;border-radius:5px;background:rgba(0,0,0,.06);font-size:10px;color:#9ca3af;">없음</span>
    {% endif %}
</td>
