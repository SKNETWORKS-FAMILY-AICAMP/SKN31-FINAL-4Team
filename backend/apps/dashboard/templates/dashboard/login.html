<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FEEDiT 관리자 - 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#f1efea; --card:#fff; --ink:#1c1a17; --coral:#ff6b4a;
    --tx:#0a0a0a; --tx2:rgba(10,10,10,.62); --tx3:rgba(10,10,10,.38);
    --line:rgba(10,10,10,.13);
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--tx);padding:24px;
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',
      'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .box{width:100%;max-width:392px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:26px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .brand b{font-size:17px;letter-spacing:-.4px}
  .brand span{font-size:12px;color:var(--tx3)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:26px 24px}
  h1{font-size:16px;margin:0 0 5px;letter-spacing:-.3px}
  .sub{font-size:12.5px;color:var(--tx2);margin:0 0 20px;line-height:1.65}
  label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:7px;margin-top:15px}
  input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;background:var(--bg);color:var(--tx);
    font-family:inherit;}
  input:focus{outline:2px solid var(--coral);outline-offset:-1px;background:#fff}
  input::placeholder{color:var(--tx3);}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    font-family:inherit}
  button:hover{opacity:.9}
  .msg{margin-top:13px;font-size:12.5px;line-height:1.6;padding:11px 13px;
    border-radius:9px;display:none}
  .msg.err{display:block;background:rgba(192,57,43,.07);color:#c0392b}
  .foot{margin-top:18px;font-size:11.5px;color:var(--tx3);line-height:1.75;text-align:center}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <span class="mark">F</span>
    <div><b>FEEDiT</b> <span>관리자</span></div>
  </div>

  <div class="card">
    <h1>관리자 로그인</h1>
    <p class="sub">관리자 계정으로 로그인해 주세요.</p>

    <form method="POST" autocomplete="off">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" autofocus required>
      
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
      
      <button type="submit" id="go">로그인</button>
    </form>

    {% if messages %}
    <div class="msg err">
      {% for message in messages %}
        {{ message }}
      {% endfor %}
    </div>
    {% endif %}
  </div>

  <p class="foot">
    접근 권한이 없다면 팀 관리자에게 문의하세요.
  </p>
</div>
</body>
</html>
