  # ── 색 (color)
  color:
    - [블랙, 검정, black]
    - [화이트, 흰색, white]
    - [그레이, 회색, gray, grey]
    - [네이비, navy]
    - [베이지, beige]
    - [브라운, 갈색, 다크브라운, brown]
    - [블루, 파랑, blue]
    - [크림, 아이보리]
    - [카키, 올리브]
    - [핑크, 분홍]

  # ── 착용 상황 (tpo)
  tpo:
    - [출근, 오피스, 정장]
    - [바캉스, 휴양지, 리조트]
    - [여행]
    - [하객]
    - [데이트]
    - [운동, 짐]

  # ── 계절 (season) — 트렌드 지수에서는 뺍니다. 계절어는 늘 오르내려서
  #    '트렌드'가 아니라 달력이 만드는 노이즈입니다.
  season:
    trendable: false
    words:
      - [봄, 스프링, SPRING]
      - [여름, 서머, SUMMER]
      - [가을, 폴, FALL]
      - [겨울, 윈터, WINTER]

  # ── 성별 (body) — 태깅은 하되 트렌드에서 뺍니다.
  body:
    trendable: false
    words:
      - [남성, 남자, 맨즈]
      - [여성, 여자, 우먼]
      - [키즈, 아동]
