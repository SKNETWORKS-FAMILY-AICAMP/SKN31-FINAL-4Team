# ═══════════════════════════════════════════════════════════════
#  FEEDiT 패션 어휘 사전 — 스타일·핏·소재·아이템 태깅의 기준
#  ---------------------------------------------------------------
#  ★ 지어내지 않았습니다. 무신사 상세에서 실제로 뽑은 태그 392개를
#    전부 눈으로 보고 분류한 것입니다. 있지도 않은 말을 넣어 두면
#    지표에 0 만 찍히고, 정작 있는 말을 놓칩니다.
#
#  ★ 왜 '부분 일치'인가
#    한국 패션 태그는 합성어입니다.
#        와이드팬츠 = 와이드(핏) + 팬츠(아이템)
#        오버핏셔츠 = 오버핏(핏) + 셔츠(아이템)
#    태그를 통째로 사전에 넣으면 조합마다 새 항목이 필요해 끝이 없습니다.
#    조각으로 넣고 부분 일치로 잡으면 조합은 저절로 풀립니다.
#
#  ★ 이게 '태그 없는 사이트'까지 구해 줍니다
#    지그재그·에이블리·크림에는 태그가 없습니다. 대신 상품명이 있습니다.
#        '[MADE]릴카 언발 오프숄더 반팔 티셔츠'  → 오프숄더(디테일) · 반팔(핏) · 티셔츠(아이템)
#    같은 사전을 상품명에 돌리면 됩니다. 사이트마다 다른 규칙을 짜지 않아도 됩니다.
#
#  ★ facet 은 스키마의 lexicon_term.facet 을 그대로 씁니다.
#      style | item | material | color | fit | tpo | brand | season | body | etc
#
#  ※ 한 말이 두 축에 걸리면(크롭 = 핏이자 아이템) 한 축에만 둡니다.
#    설계서에 적힌 대로입니다 — 화면이 축별 Top-N 을 그리므로
#    중복 등재하면 같은 말이 두 번 나옵니다.
# ═══════════════════════════════════════════════════════════════

version: 1
updated: "2026-08-25"

# ── 무조건 버리는 것 ─────────────────────────────────────────
#  무신사 태그에서 가장 많이 나온 말이 '무배당발'(27회)입니다.
#  이걸 안 막으면 트렌드 1위 키워드가 '무배당발'이 됩니다.
block:
  exact:
    - 무배당발
    - 무신사단독
    - 단독
    - MDPICK
    - TIMESALE
    - BRANDDAY
    - 라이브
    - 스테디셀러
    - 캐리오버
    - 컬렉션
    - 패키지
    - 3P
    - BEST용품
    - 신학기잡화
    - 겨울잡화
    - 쿨아이템
    - 여자친구선물
    - 코인
    - 패션
    - 데일리          # 어디에나 붙어서 변별력이 0 입니다
  # 규칙으로 거릅니다 — 목록을 아무리 늘려도 새 말이 계속 생깁니다.
  pattern:
    - "PICK$"          # 철사장PICK · 가훤PICK
    - "추천$"          # 볼캡추천 · 반지추천 · 스니커즈추천
    - "^\\d{2}(SS|FW|HS|SPRING|SUMMER|F/W|S/S)"   # 25SS · 26HS
    - "^\\d{4}(SS|FW)"                             # 2026SS
    - "컬렉션$"
    - "^[A-Z]{4,}$"    # SWEATS · WESTERN · BAGSERIES

# ── 축별 어휘 ─────────────────────────────────────────────────
#  surface: 실제로 쓰이는 표기들. 첫 항목이 표준어(canonical)입니다.
#  trendable: false 면 태깅은 하되 트렌드 지수에서 뺍니다.
terms:

  # ── 핏 (fit) — 옷의 실루엣. 트렌드가 가장 빨리 도는 축입니다.
  fit:
    - [오버핏, 오버사이즈, 오버 핏, 세미오버핏, oversize]
    - [루즈핏, 루즈, 릴랙스핏, 릴렉스핏]
    - [와이드, 와이드핏, WIDEFIT]
    - [슬림핏, 슬림, 스키니]
    - [크롭, 크롭기장, 크롭트]
    - [벌룬핏, 벌룬]
    - [배기, 배기핏]
    - [커브드, 커브드핏]
    - [테이퍼드]
    - [하이웨스트, 하이라이즈]
    - [밴딩, 밴딩핏]
    - [반팔, 반소매, 숏슬리브]
    - [긴팔, 롱슬리브, 긴소매]
    - [민소매, 나시, 슬리브리스]
    - [하프, 하프기장, 8부, 9부]
    - [언발, 언발란스, 언밸런스]
    - [오프숄더, 오프 숄더]
    - [홀터넥, 홀터]
    - [카울넥]
    - [브이넥, V넥]
    - [백리스]

  # ── 스타일 (style) — '무슨 결의 옷인가'. EDIT 이 가장 보고 싶어 하는 축.
  style:
    - [워크웨어, 워크, 워크부츠]
    - [아메카지]
    - [캐주얼]
    - [클래식]
    - [빈티지, 워시드빈티지]
    - [미니멀]
    - [락시크, 록시크]
    - [웨스턴, WESTERN]
    - [젠더리스, 유니섹스, 남녀공용]
    - [베이직, 베이식, 기본]
    - [레이어드]
    - [아웃도어, 하이킹, 등산]
    - [스포티, 스포츠, 러닝, 마라톤, 골프, 트레이닝]
    - [프레피]
    - [고프코어]
    - [발레코어]
    - [Y2K, 와이투케이]
    - [레트로]
    - [페미닌]
    # ★ 현재 프론트 스타일 탭의 표기인 '스트릿웨어'를 대표로 둡니다.
    - [스트릿웨어, 스트릿, 스트리트, streetwear]
    - [핀터룩]
    - [프리미엄, 명품]

    # ── FEEDiT 프론트가 쓰는 14종 중 여기 없던 것들 ──
    #  화면(feedit-mockup-v2.html 의 STYLES)에 정의돼 있는데 사전엔 빠져
    #  있었습니다. 무신사에서 이 이름으로 검색해 태그를 붙일 예정이라
    #  사전에 없으면 애써 긁어 와도 태그가 안 붙습니다.
    - [블록코어, 블로크코어, blokecore]
    - [포엣코어, poetcore, 시인룩]
    - [놈코어, normcore, 꾸안꾸]
    - [비즈니스코어, 비즈코어, businesscore, 오피스룩]
    # '에슬레저' 로 적는 곳이 많습니다. 둘 다 받습니다.
    - [애슬레저, 에슬레저, athleisure, 애슬레저룩]
    - [포멀, formal, 정장룩]
    - [그런지, grunge, 그런지룩]
    # 14종 스타일 탭에 포함되는 코어 라벨
    - [바이크코어, 바이커코어, bikercore, 바이커룩, 레이싱]
    - [긱시크, 긱룩, geekchic, 너드룩]

  # ── 소재 (material)
  material:
    - [코튼, 면, 순면, 코마사]
    - [린넨, 마]
    - [데님, 청바지, 진청, 생지, 워싱, 논페이드]
    - [레더, 가죽, 소가죽, 비건레더]
    - [니트, 스웨터]
    - [스웨트, 스웻, SWEAT]
    - [저지]
    - [와플]
    - [시어서커]
    - [캔버스]
    - [시스루, 시어]
    - [체크, 체크무늬]
    - [해링본]
    - [옴브레]
    - [써지컬스틸, 써지컬]
    - [실버]
    - [메탈]
    - [골지]
    - [리버시블]

  # ── 아이템 (item) — 무엇인가. 카테고리와 겹치지만 더 잘게 봅니다.
  item:
    # ★ 합성형을 통째로 둔다. '반팔티' 만 먹으면 '셔츠' 가 남아
    #   티셔츠와 셔츠가 동시에 잡히는 사고가 난다.
    - [티셔츠, 반팔티셔츠, 긴팔티셔츠, 반소매티셔츠, 롱슬리브티셔츠,
       반팔티, 긴팔티, 롱슬리브티, 티셔트]
    - [폴로셔츠, 피케, 카라티, 폴로]
    - [셔츠, 남방]
    - [블라우스]
    - [니트탑, 니트웨어]
    - [원피스, 드레스]
    - [스커트, 치마, 미니스커트, 롱스커트, 플리츠스커트]
    - [팬츠, 바지, 슬랙스]
    - [데님팬츠, 청바지]
    - [반바지, 숏팬츠, 하프팬츠, 버뮤다]
    - [조거팬츠, 트레이닝팬츠, 스웨트팬츠, 스웻팬츠]
    - [카고팬츠, 카펜터, 치노]
    - [자켓, 재킷, 블루종, 블레이저]
    - [아우터, 코트, 패딩, 바람막이, 윈드브레이커]
    - [수트, 슈트]
    - [트랙탑, 트랙자켓]
    - [후드, 후디]
    - [맨투맨, 스웨트셔츠]
    - [가방, 백]
    - [백팩, 짐색]
    - [크로스백, 메신저백]
    - [숄더백, 토트백, 쇼퍼백, 에코백]
    - [보스턴백, 더플백]
    - [모자, 볼캡, 캡, 야구모자, 버킷햇, 사파리햇]
    - [신발, 슈즈]
    - [스니커즈, 운동화]
    - [부츠, 워커]
    - [로퍼, 더비슈즈, 구두]
    - [샌들, 슬리퍼, 쪼리, 플립플랍, 클로그]
    - [플랫슈즈, 메리제인]
    - [양말, 삭스]
    - [벨트]
    - [목걸이, 네크리스]
    - [팔찌, 브레이슬릿]
    - [반지]
    - [귀걸이]
    - [키링, 열쇠고리, 키체인]
    - [선글라스, 고글]
    - [안경, 안경테, 아이웨어]
    - [스카프, 반다나, 두건, 커치프]
    # 실제 태그에서 못 잡았던 것들을 채웁니다 (미상 28종을 눈으로 보고 추림).
    # 킨·테렉스·빅샷·1461 같은 건 브랜드·제품명이라 일부러 안 넣습니다 —
    # 사전에 넣으면 트렌드 지표가 특정 브랜드 홍보판이 됩니다.
